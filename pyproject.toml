[project]
name = "pricing-engine"
version = "0.1.0"
description = "Dynamic pricing engine — rules, guardrails, and pricing API"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "cachetools>=5.3",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-cachetools>=5.3",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: exercises the full generate->train pipeline; a few seconds, not excluded by default"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# DTZ: naive datetimes/dates are intentional here — multi-region/timezone handling is
# explicitly out of scope for v1 (see docs/dynamic-pricing-engine-plan_1.md).
ignore = ["DTZ001", "DTZ003", "DTZ011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` in argument defaults is the documented DI idiom, not
# the mutable-default-argument bug B008 normally guards against.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.9"
strict = true

[[tool.mypy.overrides]]
# No stubs exist for sklearn/joblib.
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ignore_missing_imports alone only silences "cannot find implementation" —
# under strict mode, every value flowing out of an untyped sklearn/pandas call
# is `Any`, and strict's Any-propagation checks still fire throughout ml/*.
# Relax those checks for this package only; pricing/, catalog/, api/,
# persistence/ keep full strict enforcement.
module = "pricing_engine.ml.*"
disallow_any_explicit = false
warn_return_any = false
